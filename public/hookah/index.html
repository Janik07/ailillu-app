<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Конструктор кальяна</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: меню заведения Ailillu (герой, чипы, сетка блюд) + шторка «Свой кальян» с 3D-сценой сверху и шагами снизу.
   Токены — палитра Ailillu из ailillu_ui (светлая и тёмная), Golos Text, углы control 16 / photo 20 / sheet 28. */
:root{
  --bg:#ffffff; --page:#f2f2f2; --fill:#f1f1f1; --track:#f0f0f0; --modal:#ffffff;
  --ink:#000002; --muted:#6b6b6b; --hair:rgba(0,0,2,.08); --row:rgba(0,0,2,.12); --pressed:rgba(0,0,2,.08);
  --primary:#673ab7; --on-primary:#ffffff; --primary-soft:#ede7f6; --on-primary-soft:#673ab7;
  --secondary:#b39ddb; --star:#ffb300; --success:#0f7b44;
  --scrim:rgba(0,0,0,.55); --glass:rgba(0,0,0,.38); --glass-edge:rgba(255,255,255,.24);
  --shadow:0 2px 10px rgba(0,0,2,.06); --shadow-float:0 8px 28px rgba(0,0,2,.14);
  --scene-top:#f7f6f9; --scene-bottom:#e6e4ea;
  --c-control:16px; --c-photo:20px; --c-sheet:28px;
  --font:'Golos Text', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#121212; --page:#121212; --fill:#2a2a2a; --track:#2c2c2c; --modal:#1e1e1e;
  --ink:#ffffff; --muted:#949494; --hair:rgba(255,255,255,.1); --row:rgba(255,255,255,.18); --pressed:rgba(255,255,255,.08);
  --primary-soft:#2b233a; --on-primary-soft:#c9b6ef;
  --shadow:0 2px 10px rgba(0,0,0,.4); --shadow-float:0 8px 28px rgba(0,0,0,.5);
  --scene-top:#1d1b21; --scene-bottom:#0f0e11; color-scheme:dark;
} }
:root[data-theme="dark"]{
  --bg:#121212; --page:#121212; --fill:#2a2a2a; --track:#2c2c2c; --modal:#1e1e1e;
  --ink:#ffffff; --muted:#949494; --hair:rgba(255,255,255,.1); --row:rgba(255,255,255,.18); --pressed:rgba(255,255,255,.08);
  --primary-soft:#2b233a; --on-primary-soft:#c9b6ef;
  --shadow:0 2px 10px rgba(0,0,0,.4); --shadow-float:0 8px 28px rgba(0,0,0,.5);
  --scene-top:#1d1b21; --scene-bottom:#0f0e11; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--page); color:var(--ink); font-family:var(--font); overflow:hidden; -webkit-tap-highlight-color:transparent}
button{font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer}
button:focus-visible{outline:2px solid var(--primary); outline-offset:2px}
img{display:block}

/* панель макета */
.app{height:100%; display:flex; flex-direction:column}
.bar{display:flex; align-items:center; gap:16px; padding-block:10px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); border-bottom:1px solid var(--hair); background:var(--bg); flex:none}
.bar .ttl{display:flex; flex-direction:column; min-width:0; flex:1}
.bar .ttl b{font-size:15px; font-weight:700}
.bar .ttl small{font-size:12px; color:var(--muted)}
.bar .ttl b, .bar .ttl small{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.seg{display:flex; background:var(--track); border-radius:12px; padding:3px; flex:none}
.seg button{padding:7px 14px; border-radius:9px; font-size:13px; font-weight:600; color:var(--muted); transition:background .2s, color .2s, box-shadow .2s}
.seg button[aria-pressed="true"]{background:var(--bg); color:var(--ink); box-shadow:var(--shadow)}
.bar .note{font-size:12px; color:var(--muted); max-width:290px; margin:0; line-height:1.35}
@media (max-width:860px){ .bar .note{display:none} }
@media (max-width:560px){ .bar .ttl small{display:none} .seg button{padding:7px 11px} }

.stage{flex:1; position:relative; min-height:0; overflow:hidden; background:var(--page)}
.device{position:absolute; left:50%; top:50%; transform-origin:center center}
.device.fill{left:0; top:0; width:100%!important; height:100%!important; transform:none!important}
.device[data-device="phone"]:not(.fill){border-radius:54px; box-shadow:0 0 0 11px #1b1b1d, 0 0 0 12px #3a3a3e, 0 40px 100px rgba(0,0,0,.28)}
.device[data-device="kiosk"]{border-radius:38px; box-shadow:0 0 0 24px #1b1b1d, 0 0 0 25px #3a3a3e, 0 50px 120px rgba(0,0,0,.3)}
.screen{position:absolute; inset:0; overflow:hidden; background:var(--bg); border-radius:inherit; font-size:16px}
.device[data-device="kiosk"] .screen{font-size:30px}
.device[data-device="kiosk"] .vbtn{width:64px; height:64px}
.device[data-device="kiosk"] .vbtn svg{width:30px; height:30px}
.device[data-device="kiosk"] .opt{padding:18px; border-radius:20px}
.device[data-device="kiosk"] .opt .ck{width:28px; height:28px; top:12px; right:12px}
.device[data-device="kiosk"] .opt.row{grid-template-columns:64px minmax(0,1fr)}
.device[data-device="kiosk"] .opt.row .ri{width:64px; height:64px}
.device[data-device="kiosk"] .stepper{grid-template-columns:60px 70px 60px; height:56px}
.device[data-device="kiosk"] .stepper button{height:56px; font-size:28px}
.device[data-device="kiosk"] .stepper span{font-size:20px}
.device[data-device="kiosk"] .mrow .dot{width:22px; height:22px}
.device[data-device="kiosk"] .fchip .dot{width:24px; height:24px}
.device[data-device="kiosk"] .segc button i b{width:6px; height:14px}
.device[data-device="kiosk"] .gbtn{width:64px; height:64px}
.device[data-device="kiosk"] .gbtn svg{width:30px; height:30px}
.device[data-device="kiosk"] .cartbar .n{min-width:40px; height:40px; border-radius:20px; font-size:20px}
.device[data-device="kiosk"] .dish .tag{border-radius:10px; padding:0 12px}
.sbar{position:absolute; top:0; left:0; right:0; height:46px; display:flex; align-items:center; justify-content:space-between; padding:0 34px 0 40px; font-size:15px; font-weight:600; z-index:30; pointer-events:none; color:#fff; transition:color .3s}
.sbar.ink{color:var(--ink); background:var(--bg)}
.sbar.ink.clear{background:transparent}
.sbar i{display:inline-block; width:25px; height:12px; border:1.5px solid currentColor; border-radius:4px; position:relative; opacity:.8}
.sbar i::after{content:""; position:absolute; inset:1.5px; right:5px; background:currentColor; border-radius:1.5px}
.device.fill .sbar, .device[data-device="kiosk"] .sbar{display:none}

/* ---------- меню заведения ---------- */
.menu{position:absolute; inset:0; overflow-y:auto; overflow-x:hidden; scrollbar-width:none; padding-bottom:96px}
.menu::-webkit-scrollbar{display:none}
.hero{position:relative; height:320px; overflow:hidden}
.device[data-device="kiosk"] .hero{height:13em}
.hero img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
.hero::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,.25), rgba(0,0,0,0) 30%, rgba(0,0,0,.15) 55%, var(--scrim))}
.hero .htext{position:absolute; left:16px; right:16px; bottom:16px; z-index:1; color:#fff; display:grid; gap:6px}
.device[data-device="kiosk"] .hero .htext{left:1.2em; right:1.2em; bottom:1em}
.hero h1{margin:0; font-size:2.25em; font-weight:800; letter-spacing:-.02em; line-height:1.05; text-wrap:balance}
.device[data-device="kiosk"] .hero h1{font-size:1.9em}
.hero .meta{font-size:.94em; font-weight:500; display:flex; align-items:center; gap:6px}
.hero .meta svg{width:18px; height:18px; color:var(--star)}
.gbtn{position:absolute; top:52px; width:44px; height:44px; border-radius:50%; display:grid; place-items:center; background:var(--glass); box-shadow:inset 0 0 0 1px var(--glass-edge); color:#fff; z-index:2; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px)}
.gbtn svg{width:22px; height:22px}
.device.fill .gbtn, .device[data-device="kiosk"] .gbtn{top:calc(12px + env(safe-area-inset-top, 0px))}
.gbtn.l{left:16px} .gbtn.r{right:16px}
.wrap{padding-inline:16px}
.device[data-device="kiosk"] .wrap{padding-inline:1.2em}
.tile-row{margin-top:16px; display:flex; align-items:center; gap:12px; min-height:56px; padding:0 16px; border-radius:var(--c-control); background:var(--fill); font-weight:500; width:100%; text-align:left}
.tile-row svg{width:22px; height:22px; flex:none}
.tile-row span{flex:1}
.tile-row .chev{color:var(--muted)}
.chips-bar{position:sticky; top:0; z-index:5; background:var(--bg); padding-block:12px; margin-top:4px}
.chips{display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; padding-inline:16px}
.device[data-device="kiosk"] .chips{padding-inline:1.2em}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none; height:40px; padding:0 16px; border-radius:var(--c-control); background:var(--fill); font-size:14px; font-weight:500; display:inline-flex; align-items:center; gap:8px; white-space:nowrap; transition:background .2s, color .2s, transform .12s}
.device[data-device="kiosk"] .chip{height:2.1em; font-size:.8em; padding:0 .9em}
.device[data-device="kiosk"] .chip svg{width:26px; height:26px}
.device[data-device="kiosk"] .tile-row{min-height:2.3em; font-size:.85em; padding:0 .7em}
.device[data-device="kiosk"] .tile-row svg{width:30px; height:30px}
.chip:active{transform:scale(.96)}
.chip[aria-pressed="true"]{background:var(--primary); color:var(--on-primary); font-weight:700}
.chip.hk{background:var(--primary-soft); color:var(--on-primary-soft); font-weight:700}
.chip.hk svg{width:18px; height:18px}
.sect{padding-top:12px}
.sect h2{margin:12px 0 12px; font-size:1.75em; font-weight:800; letter-spacing:-.02em; line-height:1.1}
.device[data-device="kiosk"] .sect h2{font-size:1.4em}
.dgrid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px}
.device[data-device="kiosk"] .dgrid{grid-template-columns:repeat(3,minmax(0,1fr)); gap:.8em}
.dish{display:flex; flex-direction:column; gap:8px; text-align:left; min-width:0}
.dish .ph{aspect-ratio:1; border-radius:var(--c-photo); overflow:hidden; background:var(--fill); position:relative}
.dish .ph img{width:100%; height:100%; object-fit:cover}
.dish .nm{font-size:1em; font-weight:500; line-height:1.25}
.device[data-device="kiosk"] .dish .nm{font-size:.8em}
.dish .pr{font-size:.94em; font-weight:600; font-variant-numeric:tabular-nums}
.device[data-device="kiosk"] .dish .pr{font-size:.76em}

/* промо «Свой кальян» */
.hpromo{display:grid; grid-template-columns:minmax(0,1fr) 42%; align-items:stretch; border-radius:24px; overflow:hidden; background:var(--fill); text-align:left; width:100%; min-height:190px; position:relative}
.device[data-device="kiosk"] .hpromo{min-height:9em; grid-template-columns:minmax(0,1fr) 34%}
.hpromo .tx{padding:18px 4px 18px 18px; display:flex; flex-direction:column; gap:8px}
.hpromo .tx b{font-size:1.3em; font-weight:800; letter-spacing:-.01em; line-height:1.1}
.hpromo .tx span{font-size:.88em; color:var(--muted); line-height:1.35}
.hpromo .tx em{font-style:normal; margin-top:auto; display:inline-flex; align-self:flex-start; align-items:center; gap:6px; height:40px; padding:0 16px; border-radius:var(--c-control); background:var(--primary); color:var(--on-primary); font-weight:700; font-size:.88em}
.device[data-device="kiosk"] .hpromo .tx em{height:2em}
.hpromo .ph{position:relative; background:#fff}
.hpromo .ph img{position:absolute; inset:0; width:100%; height:100%; object-fit:contain; padding:8px}
.mixrail{display:grid; grid-auto-flow:column; grid-auto-columns:42%; gap:16px; overflow-x:auto; scrollbar-width:none; margin:16px -16px 0; padding:0 16px}
.mixrail::-webkit-scrollbar{display:none}
.device[data-device="kiosk"] .mixrail{grid-auto-flow:row; grid-template-columns:repeat(3,minmax(0,1fr)); margin:1em 0 0; padding:0; gap:.8em}
.mixart{position:absolute; inset:0; display:grid; place-items:center}
.mixart i{position:absolute; border-radius:50%; filter:blur(.5px); box-shadow:inset 0 -10px 20px rgba(0,0,0,.18), inset 0 8px 14px rgba(255,255,255,.45)}
.dish .tag{position:absolute; top:8px; left:8px; height:24px; padding:0 8px; border-radius:8px; background:var(--glass); color:#fff; font-size:12px; font-weight:600; display:flex; align-items:center; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px)}
.device[data-device="kiosk"] .dish .tag{font-size:.55em; height:1.6em}
.dish .sub{font-size:.8em; color:var(--muted); line-height:1.3}
.device[data-device="kiosk"] .dish .sub{font-size:.62em}

/* корзина */
.cartbar{position:absolute; left:16px; right:16px; bottom:calc(16px + env(safe-area-inset-bottom, 0px)); height:60px; border-radius:var(--c-control); background:var(--primary); color:var(--on-primary); display:flex; align-items:center; gap:12px; padding:0 16px; z-index:8; box-shadow:0 10px 30px rgba(103,58,183,.35); transform:translateY(140%); transition:transform .45s cubic-bezier(.165,.84,.44,1)}
.device:not(.fill)[data-device="phone"] .cartbar{bottom:28px}
.device[data-device="kiosk"] .cartbar{left:1.2em; right:1.2em; height:2.8em; bottom:1em; font-size:.85em}
.cartbar.on{transform:none}
.cartbar .n{min-width:28px; height:28px; border-radius:14px; background:rgba(255,255,255,.2); display:grid; place-items:center; font-weight:700; font-size:14px}
.cartbar b{flex:1; font-weight:700}
.cartbar span{font-weight:700; font-variant-numeric:tabular-nums}

/* ---------- конструктор: сцена на весь экран, управление поверх неё ---------- */
.sheet-scrim{position:absolute; inset:0; background:var(--scrim); opacity:0; pointer-events:none; transition:opacity .35s; z-index:18}
.sheet-scrim.on{opacity:1; pointer-events:auto}
.builder{position:absolute; inset:0; z-index:20; background:#0d0a10; color:#fff; overflow:hidden; transform:translateY(102%); transition:transform .55s cubic-bezier(.165,.84,.44,1); border-radius:inherit; font-size:16px; --glass:rgba(24,20,30,.5); --glass-hi:rgba(255,255,255,.14); --edge:rgba(255,255,255,.12); --soft-ink:rgba(255,255,255,.66)}
.device[data-device="kiosk"] .builder{font-size:25px}
.builder.on{transform:none}
.view{position:absolute; inset:0; touch-action:none}
.view canvas{display:block; width:100%!important; height:100%!important; outline:none}
.loading{position:absolute; inset:0; display:grid; place-items:center; color:var(--soft-ink); font-size:.9em; z-index:2; pointer-events:none}
.loading.gone{display:none}
.sbar.scene{color:#fff; background:transparent}

.btop{position:absolute; left:0; right:0; top:0; z-index:4; padding-top:46px; background:linear-gradient(180deg, rgba(8,6,12,.72), rgba(8,6,12,.35) 70%, rgba(8,6,12,0)); pointer-events:none}
.device.fill .btop{padding-top:env(safe-area-inset-top, 0px)}
.device[data-device="kiosk"] .btop{padding-top:.4em}
.vtop{display:flex; align-items:center; gap:.75em; padding:.5em 1em .25em}
.gl{pointer-events:auto; width:2.75em; height:2.75em; flex:none; border-radius:50%; display:grid; place-items:center; background:var(--glass-hi); box-shadow:inset 0 0 0 1px var(--edge); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); color:#fff}
.gl svg{width:1.35em; height:1.35em}
.vtitle{flex:1; min-width:0; text-align:center}
.vtitle b{display:block; font-size:1.06em; font-weight:700}
.vtitle span{display:block; font-size:.78em; color:var(--soft-ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.steps{pointer-events:auto; display:flex; gap:.5em; overflow-x:auto; scrollbar-width:none; padding:.5em 1em .9em}
.steps::-webkit-scrollbar{display:none}
.steps button{flex:none; height:2.25em; padding:0 1em; border-radius:1em; background:var(--glass-hi); box-shadow:inset 0 0 0 1px var(--edge); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); font-size:.875em; font-weight:500; white-space:nowrap; transition:background .2s, transform .12s}
.steps button:active{transform:scale(.96)}
.steps button[aria-pressed="true"]{background:var(--primary); box-shadow:0 6px 18px rgba(103,58,183,.45); font-weight:700}

/* точки на деталях кальяна */
.hots{position:absolute; inset:0; z-index:3; pointer-events:none; opacity:0; transition:opacity .35s}
.hots.on{opacity:1}
.hot{position:absolute; left:0; top:0; display:flex; align-items:center; gap:.45em; pointer-events:auto; padding:.3em .7em .3em .3em; border-radius:1em; background:rgba(16,13,22,.5); box-shadow:inset 0 0 0 1px var(--edge); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); font-size:.8em; font-weight:600; white-space:nowrap; will-change:transform}
.hots:not(.on) .hot{pointer-events:none}
.hot i{width:1.1em; height:1.1em; border-radius:50%; background:#fff; position:relative; flex:none; box-shadow:0 0 0 .25em rgba(179,157,219,.45)}
.hot i::after{content:""; position:absolute; inset:-.35em; border-radius:50%; border:2px solid rgba(255,255,255,.7); animation:ping 2.2s ease-out infinite}
@keyframes ping{from{transform:scale(.6); opacity:1} to{transform:scale(1.8); opacity:0}}

/* низ: вкладки группы, лента вариантов, цена */
.bbot{position:absolute; left:0; right:0; bottom:0; z-index:4; padding-top:2.2em; background:linear-gradient(0deg, rgba(8,6,12,.9), rgba(8,6,12,.72) 55%, rgba(8,6,12,0))}
.groups{display:flex; align-items:center; gap:1.25em; padding:0 1em .55em; overflow-x:auto; scrollbar-width:none}
.groups::-webkit-scrollbar{display:none}
.groups button{flex:none; font-size:.875em; font-weight:600; color:var(--soft-ink); padding:.35em 0; position:relative; transition:color .2s}
.groups button[aria-pressed="true"]{color:#fff}
.groups button[aria-pressed="true"]::after{content:""; position:absolute; left:0; right:0; bottom:-.1em; height:2px; border-radius:1px; background:var(--secondary)}
.groups .nx{margin-left:auto; color:#fff; display:flex; align-items:center; gap:.3em}
.groups .nx svg{width:1.05em; height:1.05em}
.opts{min-height:7.4em}
.opts.enter > *{animation:rise .38s cubic-bezier(.165,.84,.44,1) both}
@keyframes rise{from{opacity:.2; transform:translateY(10px)}}
.car{display:grid; grid-auto-flow:column; grid-auto-columns:var(--cw, 6.9em); gap:.5em; overflow-x:auto; scrollbar-width:none; padding:.1em 1em .2em; scroll-padding:1em}
.car::-webkit-scrollbar{display:none}
.card{position:relative; border-radius:1em; background:var(--glass); box-shadow:inset 0 0 0 1px var(--edge); backdrop-filter:blur(18px) saturate(1.4); -webkit-backdrop-filter:blur(18px) saturate(1.4); padding:.65em; text-align:left; display:grid; gap:.12em; align-content:start; transition:background .2s, box-shadow .2s, transform .12s}
.card:active{transform:scale(.96)}
.card[aria-pressed="true"]{background:rgba(103,58,183,.62); box-shadow:inset 0 0 0 2px var(--secondary), 0 8px 24px rgba(103,58,183,.35)}
.card .nm{font-weight:600; font-size:.875em; line-height:1.2}
.card .pr{font-size:.75em; color:var(--soft-ink); font-variant-numeric:tabular-nums; line-height:1.25}
.card[aria-pressed="true"] .pr{color:rgba(255,255,255,.85)}
.card.c{text-align:center; justify-items:center}
.card .ic{height:3.1em; display:grid; place-items:center; margin-bottom:.3em}
.card .ic svg{height:100%; width:auto; overflow:visible}
.card .ball{width:2.6em; height:2.6em; border-radius:50%; margin:.1em 0 .35em; box-shadow:inset 0 0 0 1px rgba(255,255,255,.15), 0 4px 10px rgba(0,0,0,.35)}
.card .ck{position:absolute; top:.45em; right:.45em; width:1.2em; height:1.2em; border-radius:50%; background:#fff; color:var(--primary); display:grid; place-items:center; transform:scale(0); transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.card .ck svg{width:.75em; height:.75em}
.card[aria-pressed="true"] .ck{transform:scale(1)}
.card .mixline{display:flex; height:.4em; border-radius:.2em; overflow:hidden; gap:2px; margin:.3em 0 .2em}
.card .mixline span{height:100%}
.sv-glass{fill:rgba(255,255,255,.08); stroke:#fff; stroke-width:1.2; opacity:.9}
.sv-liq{opacity:.75}
.sv-dark{fill:#d8d4e0}
.sv-steel{fill:#9c97a8}

.segc{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:.3em; margin:0 1em; padding:.3em; border-radius:1em; background:var(--glass); box-shadow:inset 0 0 0 1px var(--edge); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px)}
.segc button{min-height:3.6em; border-radius:.75em; font-size:.72em; font-weight:600; color:var(--soft-ink); display:grid; justify-items:center; align-content:center; gap:.4em; line-height:1.15; padding:.3em .15em; transition:background .2s, color .2s}

function canvasTex(w, h, draw, { srgb = true, repeat = false } = {}){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = 8; return t;
}
function makeTextures(){
  TEX.blob = canvasTex(256, 256, (g, w) => { const r = g.createRadialGradient(w/2,w/2,0,w/2,w/2,w/2); r.addColorStop(0,'rgba(0,0,0,.75)'); r.addColorStop(.45,'rgba(0,0,0,.32)'); r.addColorStop(1,'rgba(0,0,0,0)'); g.fillStyle = r; g.fillRect(0,0,w,w); });
  TEX.smoke = canvasTex(128, 128, (g, w) => { for (let i = 0; i < 26; i++){ const x = w/2 + rnd(-22,22), y = w/2 + rnd(-22,22), rr = rnd(16,40); const r = g.createRadialGradient(x,y,0,x,y,rr); r.addColorStop(0,'rgba(255,255,255,.16)'); r.addColorStop(1,'rgba(255,255,255,0)'); g.fillStyle = r; g.beginPath(); g.arc(x,y,rr,0,7); g.fill(); } });
  TEX.spark = canvasTex(64, 64, (g, w) => { const r = g.createRadialGradient(w/2,w/2,0,w/2,w/2,w/2); r.addColorStop(0,'rgba(255,255,230,1)'); r.addColorStop(.25,'rgba(255,170,70,.9)'); r.addColorStop(1,'rgba(255,90,20,0)'); g.fillStyle = r; g.fillRect(0,0,w,w); });
  TEX.ember = canvasTex(128, 128, (g, w) => {
    g.fillStyle = '#000'; g.fillRect(0,0,w,w); g.lineCap = 'round';
    for (let i = 0; i < 28; i++){ g.strokeStyle = `rgba(255,${100 + Math.random()*120|0},40,${rnd(.5,1)})`; g.lineWidth = rnd(1.5,5); g.shadowColor = '#ff7a1a'; g.shadowBlur = 8; g.beginPath(); let x = rnd(0,w), y = rnd(0,w); g.moveTo(x,y); for (let k = 0; k < 4; k++){ x += rnd(-22,22); y += rnd(-22,22); g.lineTo(x,y); } g.stroke(); }
    for (let i = 0; i < 40; i++){ g.fillStyle = `rgba(255,200,120,${rnd(.3,.9)})`; g.beginPath(); g.arc(rnd(0,w), rnd(0,w), rnd(1,3), 0, 7); g.fill(); }
  });
  TEX.ribs = canvasTex(16, 4, (g, w, h) => { const l = g.createLinearGradient(0,0,w,0); l.addColorStop(0,'#000'); l.addColorStop(.5,'#fff'); l.addColorStop(1,'#000'); g.fillStyle = l; g.fillRect(0,0,w,h); }, { srgb:false, repeat:true });
  TEX.ribs.repeat.set(160, 1);
  TEX.noise = canvasTex(256, 256, (g, w) => { g.fillStyle = '#808080'; g.fillRect(0,0,w,w); for (let i = 0; i < 2600; i++){ const v = Math.random()*255|0; g.fillStyle = `rgba(${v},${v},${v},.5)`; g.beginPath(); g.arc(rnd(0,w), rnd(0,w), rnd(.6,2.2), 0, 7); g.fill(); } }, { srgb:false, repeat:true });
  TEX.noise.repeat.set(3, 3);
  TEX.brushed = canvasTex(512, 512, (g, w) => { g.fillStyle = '#808080'; g.fillRect(0,0,w,w); for (let i = 0; i < 900; i++){ const r = rnd(4, w*.5), v = Math.random()*255|0; g.strokeStyle = `rgba(${v},${v},${v},.18)`; g.lineWidth = rnd(.4, 1.2); g.beginPath(); g.arc(w/2, w/2, r, 0, Math.PI*2); g.stroke(); } }, { srgb:false });
  TEX.crinkle = canvasTex(256, 256, (g, w) => { g.fillStyle = '#808080'; g.fillRect(0,0,w,w); for (let i = 0; i < 140; i++){ g.strokeStyle = `rgba(${Math.random()<.5?0:255},${Math.random()<.5?0:255},${Math.random()<.5?0:255},.25)`; g.lineWidth = rnd(1,3); g.beginPath(); g.moveTo(rnd(0,w), rnd(0,w)); g.lineTo(rnd(0,w), rnd(0,w)); g.stroke(); } }, { srgb:false });
  TEX.wood = canvasTex(1024, 1024, (g, w) => {
    g.fillStyle = '#3a2112'; g.fillRect(0, 0, w, w);
    for (let i = 0; i < 420; i++){
      const y0 = rnd(-20, w + 20), amp = rnd(2, 14), f = rnd(.004, .012), ph = rnd(0, 6);
      g.strokeStyle = Math.random() < .5 ? `rgba(20,10,5,${rnd(.12,.35)})` : `rgba(120,70,38,${rnd(.08,.25)})`;
      g.lineWidth = rnd(.6, 3.2); g.beginPath();
      for (let x = 0; x <= w; x += 8){ const y = y0 + Math.sin(x*f + ph)*amp + Math.sin(x*f*3.1 + ph)*amp*.25; x === 0 ? g.moveTo(x, y) : g.lineTo(x, y); }
      g.stroke();
    }
  });
  TEX.lemon = citrusTex('#f2d22e', '#f7e765', '#fff6c4');
  TEX.orange = citrusTex('#f27b12', '#ffa63d', '#ffe0b8');

}
function citrusTex(peel, pulp, light, segs = 10){
  return canvasTex(256, 256, (g, w) => {
    const c = w/2;
    g.fillStyle = peel; g.beginPath(); g.arc(c,c,c,0,7); g.fill();
    g.fillStyle = '#fbf6ea'; g.beginPath(); g.arc(c,c,c*.9,0,7); g.fill();
    for (let i = 0; i < segs; i++){ const a0 = i/segs*Math.PI*2 + .04, a1 = (i+1)/segs*Math.PI*2 - .04; const r = g.createRadialGradient(c,c,4,c,c,c*.84); r.addColorStop(0, light); r.addColorStop(.5, pulp); r.addColorStop(1, pulp); g.fillStyle = r; g.beginPath(); g.moveTo(c + Math.cos((a0+a1)/2)*6, c + Math.sin((a0+a1)/2)*6); g.arc(c,c,c*.84,a0,a1); g.closePath(); g.fill(); }
    for (let i = 0; i < 120; i++){ const a = rnd(0,7), d = rnd(c*.2, c*.8); g.fillStyle = 'rgba(255,255,255,.25)'; g.beginPath(); g.ellipse(c + Math.cos(a)*d, c + Math.sin(a)*d, 1.5, 4, a, 0, 7); g.fill(); }
    g.fillStyle = '#fff8e6'; g.beginPath(); g.arc(c,c,7,0,7); g.fill();
  });
}
function smooth(pts, n){
  const curve = new THREE.CatmullRomCurve3(pts.map(([r, y]) => new THREE.Vector3(r, y, 0)), false, 'centripetal');
  return curve.getPoints(n).map(v => new THREE.Vector2(Math.max(0, v.x), v.y));
}
function radiusAt(prof, y){ for (let i = 1; i < prof.length; i++){ const a = prof[i-1], b = prof[i]; if (b.y >= y){ const t = (y - a.y)/Math.max(1e-5, b.y - a.y); return a.x + (b.x - a.x)*t; } } return prof[prof.length-1].x; }
function clipProfile(prof, level, k, y0 = .035){
  const out = [new THREE.Vector2(0, y0)];
  for (let i = 0; i < prof.length; i++){ const p = prof[i]; if (p.y < y0) continue; if (p.y <= level) out.push(new THREE.Vector2(p.x*k, p.y)); else { const q = prof[i-1]; const t = (level - q.y)/(p.y - q.y); out.push(new THREE.Vector2((q.x + (p.x - q.x)*t)*k, level)); break; } }
  out.push(new THREE.Vector2(0, level)); return out;
}
const V2 = a => a.map(([x, y]) => new THREE.Vector2(x, y));
function part(name, pivotY){ const pivot = new THREE.Group(); pivot.position.y = pivotY; const inner = new THREE.Group(); inner.position.y = -pivotY; pivot.add(inner); hookah.add(pivot); parts[name] = { pivot, inner, popT:-9 }; }
function clearPart(name){ const g = parts[name].inner; g.traverse(o => { if (o.isMesh){ o.geometry.dispose(); (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => { if (!m.userData.keep) m.dispose(); }); } }); g.clear(); }
function mesh(geo, mat, go, o = {}){ const m = new THREE.Mesh(geo, mat); m.userData.go = go; m.castShadow = !!o.cast; m.receiveShadow = !!o.recv; if (o.order != null) m.renderOrder = o.order; return m; }
const pop = name => { parts[name].popT = clock.elapsedTime; S.glintT = clock.elapsedTime; };
function finishMat(id){ const f = byId(FINISH, id); return new THREE.MeshPhysicalMaterial({ color:f.color, metalness:f.metal, roughness:f.rough, clearcoat:f.coat, clearcoatRoughness:.12, envMapIntensity:1, side:THREE.DoubleSide }); }
const chrome = () => new THREE.MeshPhysicalMaterial({ color:'#e6e9ee', metalness:1, roughness:.1, clearcoat:.4, envMapIntensity:1.1, side:THREE.DoubleSide });

function buildFlask(){
  clearPart('flask');
  const sh = byId(SHAPES, cfg.shape), gl = byId(GLASS, cfg.glass);
  const prof = smooth(sh.pts, 120); S.prof = prof; S.level = sh.level;
  const tinted = gl.id !== 'clear', col = new THREE.Color(gl.color);
  const body = new THREE.MeshPhysicalMaterial({ color:col, transparent:true, opacity:tinted ? .34 : .06, roughness:.05, metalness:0, envMapIntensity:.3, side:THREE.DoubleSide, depthWrite:false });
  flaskShine = new THREE.MeshPhysicalMaterial({ color:0x000000, roughness:.03, metalness:0, clearcoat:1, clearcoatRoughness:.02, envMapIntensity:2.2,
    iridescence:.2, iridescenceIOR:1.4, iridescenceThicknessRange:[120, 420], specularColor:col.clone().lerp(new THREE.Color('#fff'), .6),
    transparent:true, blending:THREE.AdditiveBlending, depthWrite:false });
  const geo = new THREE.LatheGeometry(prof, 128), g = parts.flask.inner;
  g.add(mesh(geo, body, 'flask:shape', { order:10 }));
  g.add(mesh(geo.clone(), flaskShine, 'flask:shape', { order:11 }));
  const rim = new THREE.TorusGeometry(radiusAt(prof, 1.2) - .005, .014, 12, 64); rim.rotateX(Math.PI/2); rim.translate(0, 1.2, 0);
  g.add(mesh(rim, flaskShine, 'flask:shape', { order:11 }));
}
function buildLiquid(){

    ? new THREE.MeshPhysicalMaterial({ color:L.color, roughness:.22, clearcoat:1, clearcoatRoughness:.05, sheen:.6, sheenColor:new THREE.Color('#fff'), envMapIntensity:1 })

  addMats.peelO = keep(new THREE.MeshStandardMaterial({ color:'#f27b12', roughness:.5 }));
  addMats.lemon = keep(new THREE.MeshPhysicalMaterial({ map:TEX.lemon, roughness:.35, clearcoat:.8 }));
  addMats.orange = keep(new THREE.MeshPhysicalMaterial({ map:TEX.orange, roughness:.35, clearcoat:.8 }));
  addMats.blue = keep(new THREE.MeshPhysicalMaterial({ color:'#2b3070', roughness:.25, clearcoat:1, sheen:.5, sheenColor:new THREE.Color('#8890ff') }));
  addMats.rasp = keep(new THREE.MeshPhysicalMaterial({ color:'#c0244a', roughness:.35, clearcoat:.8 }));
  addMats.mint = keep(new THREE.MeshPhysicalMaterial({ color:'#2fa35a', roughness:.4, clearcoat:.6, side:THREE.DoubleSide }));
}
function buildAdds(fresh = []){
  const prev = {}; parts.adds.inner.children.forEach(m => { prev[m.userData.add] = true; });
  clearPart('adds');
  const g = parts.adds.inner, lvl = S.level, t0 = clock.elapsedTime;
  const rIn = (y, k) => radiusAt(S.prof, y)*.94*k;
  const put = (m, id, x, y, z, float, i) => { m.userData.add = id; m.userData.go = 'flask:adds'; m.userData.home = new THREE.Vector3(x, y, z); m.userData.float = float; m.userData.ph = Math.random()*6; m.userData.dropT = (fresh.includes(id) || !prev[id]) ? t0 + i*.07 : -9; m.position.set(x, y, z); g.add(m); };
  const lowY = Math.max(.08, Math.min(lvl - .1, .15));
  cfg.adds.forEach(id => {
    if (id === 'ice') for (let i = 0; i < 4; i++){ const a = i*1.7 + rnd(0,.6), r = rIn(lvl - .05, .62)*rnd(.25, 1); const m = new THREE.Mesh(new RoundedBoxGeometry(.13,.13,.13,3,.028), addMats.ice); m.rotation.set(rnd(0,1), rnd(0,3), rnd(0,1)); put(m, id, Math.cos(a)*r, lvl - .045, Math.sin(a)*r, true, i); }
    if (id === 'citrus') for (let i = 0; i < 3; i++){ const lem = i % 2 === 0, y = rnd(Math.min(.1, lvl - .1), lvl - .08), a = i*2.1 + rnd(0,.5), r = rIn(y, .55)*rnd(.25, .9); const m = new THREE.Mesh(new THREE.CylinderGeometry(.1,.1,.02,40), [lem ? addMats.peelL : addMats.peelO, lem ? addMats.lemon : addMats.orange, lem ? addMats.lemon : addMats.orange]); m.rotation.set(rnd(.4,1.3), rnd(0,3), rnd(-.4,.4)); put(m, id, Math.cos(a)*r, y, Math.sin(a)*r, true, i); }
    if (id === 'berries') for (let i = 0; i < 10; i++){ const y = i < 6 ? rnd(.07, lowY) : rnd(lvl - .12, lvl - .05), a = rnd(0, 6.3), r = rIn(y, .6)*rnd(.15, 1); const m = new THREE.Mesh(new THREE.SphereGeometry(rnd(.03,.042), 18, 12), i % 3 ? addMats.blue : addMats.rasp); put(m, id, Math.cos(a)*r, y, Math.sin(a)*r, i >= 6, i); }
    if (id === 'mint') for (let i = 0; i < 6; i++){ const y = lvl - rnd(.02,.06), a = rnd(0,6.3), r = rIn(y, .6)*rnd(.15, 1); const geo = new THREE.SphereGeometry(1, 18, 10); geo.scale(.07,.009,.036); const m = new THREE.Mesh(geo, addMats.mint); m.rotation.set(rnd(-.3,.3), rnd(0,6), rnd(-.3,.3)); put(m, id, Math.cos(a)*r, y, Math.sin(a)*r, true, i); }
  });
}

  const pts = [[p0.x, p0.y, 0],[p0.x + .14, p0.y - .02, .02],[p0.x + .36, p0.y - .22, .1],[.92, Math.max(.6, p0.y - .62), .26],[1.04, .38, .42],[1.02, .1, .6],[.82, .047, .84],[.5, .047, .99],[.27, .06, 1.08],[.17, .1, 1.12]];
  hoseCurve = new THREE.CatmullRomCurve3(pts.map(p => new THREE.Vector3(...p)), false, 'centripetal');
  const mat = modern
    ? new THREE.MeshPhysicalMaterial({ color:H.color, roughness:.55, sheen:.8, sheenRoughness:.6, sheenColor:new THREE.Color(H.color).lerp(new THREE.Color('#fff'), .35), clearcoat:.15, envMapIntensity:.9 })

/* камера: каждая группа вариантов показывает свою деталь в свободной зоне между верхом и низом интерфейса */
const FOCI = {
  all:   { t:[.3,1.62,.25], h:3.55, w:2.6, phi:1.34 },
  shaft: { t:[0,1.95,0],   h:1.45, w:1.3, phi:1.36 },
  hose:  { t:[.65,.8,.55], h:1.9,  w:1.9, phi:1.12 },
  flask: { t:[0,.62,0],    h:1.5,  w:1.5, phi:1.38 },
  water: { t:[0,.34,0],    h:.9,   w:1.4, phi:1.22 },
  bowl:  { t:[0,3.0,0],    h:.85,  w:1.4, phi:1.25 },
  coals: { t:[0,3.12,0],   h:.55,  w:.9,  phi:.95 },
  smoke: { t:[0,3.22,0],   h:1.25, w:1.3, phi:1.3 },

const frame = { W:1, H:1, top:0, bot:0 };
function measure(){
  frame.W = view.clientWidth || 1; frame.H = view.clientHeight || 1;
  const btop = $('btop'), bbot = $('bbot');
  frame.top = btop.offsetTop + btop.offsetHeight - 16;
  frame.bot = frame.H - bbot.offsetTop - bbot.querySelector('.groups').offsetTop + 8;
  S.goalOffY = (frame.bot - frame.top)/2;
}
function focus(instant){
  if (!controls) return;
  measure();
  const f = FOCI[groupDef().focus] || FOCI.all;
  const fov = camera.fov*Math.PI/180, freeH = Math.max(140, frame.H - frame.top - frame.bot);
  const dh = (f.h/2)/Math.tan(fov/2)*(frame.H/freeH);
  const dw = (f.w/2)/(Math.tan(fov/2)*frame.W/frame.H);
  S.goalT = new THREE.Vector3(...f.t); S.goalD = Math.max(dh, dw)*1.06; S.goalPhi = f.phi;
  S.focusUntil = clock.elapsedTime + (instant ? 0 : 2);
  if (instant){
    controls.target.copy(S.goalT);
    const sp = new THREE.Spherical().setFromVector3(camera.position.clone().sub(S.goalT));
    sp.radius = S.goalD; sp.phi = S.goalPhi; camera.position.copy(S.goalT).add(new THREE.Vector3().setFromSpherical(sp));
    S.offY = S.goalOffY;
  }
}
let scaleFactor = 1;
function resize(){

  const pr = Math.max(.75, Math.min(2, (window.devicePixelRatio || 1)*scaleFactor));
  renderer.setPixelRatio(pr); renderer.setSize(w, h, false);
  camera.aspect = w/h; measure(); camera.setViewOffset(w, h, 0, S.offY, w, h); camera.updateProjectionMatrix();
}

const ease = t => 1 - Math.pow(1 - t, 3);
const bounce = t => { const n = 7.5625, d = 2.75; if (t < 1/d) return n*t*t; if (t < 2/d) return n*(t -= 1.5/d)*t + .75; if (t < 2.5/d) return n*(t -= 2.25/d)*t + .9375; return n*(t -= 2.625/d)*t + .984375; };
const tmpM = new THREE.Matrix4(), tmpQ = new THREE.Quaternion(), tmpS = new THREE.Vector3(), tmpP = new THREE.Vector3(), sph = new THREE.Spherical();
let spawnAcc = 0, sparkAcc = 0, bubAcc = 0;
const reduce = matchMedia('(prefers-reduced-motion: reduce)');
function tick(){
  requestAnimationFrame(tick);
  if (document.hidden || S.paused){ clock.getDelta(); return; }
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
  const cyc = t % 8, inhale = cyc < 1.9 ? Math.sin(cyc/1.9*Math.PI) : 0;
  coalMat.emissiveIntensity = 1.7 + inhale*2.4 + Math.sin(t*3.3)*.18 + Math.sin(t*7.1)*.08;
  coalLight.intensity = .3 + inhale*.45;
  const lvlNow = S.level*parts.liquid.pivot.scale.y;
  bubAcc += dt*(1.2 + inhale*26);
  while (bubAcc > 1){ bubAcc--; const b = bubbleData.find(x => !x.on); if (b) Object.assign(b, { on:true, x:rnd(-.03,.03), y:.17, z:rnd(-.03,.03), r:rnd(.012,.026), v:rnd(.35,.65), ph:rnd(0,6) }); }
  bubbleData.forEach((b, i) => { if (b.on){ b.y += b.v*dt; b.x += Math.sin(t*8 + b.ph)*.0015; b.z += Math.cos(t*7 + b.ph)*.0015; if (b.y > lvlNow - .015) b.on = false; } tmpS.setScalar(b.on ? b.r : 0); tmpP.set(b.x || 0, b.y || 0, b.z || 0); tmpM.compose(tmpP, tmpQ, tmpS); bubbles.setMatrixAt(i, tmpM); });
  bubbles.instanceMatrix.needsUpdate = true; bubbles.visible = !byId(LIQUIDS, cfg.liquid).milk;
  spawnAcc += dt*(2.2 + cfg.strength*.5); while (spawnAcc > 1){ spawnAcc--; spawnSmoke('wisp'); }
  if (inhale > .3 && Math.random() < dt*5) spawnSmoke('flask');
  sparkAcc += dt*(1 + inhale*7); while (sparkAcc > 1){ sparkAcc--; spawnSpark(); }
  smoke.forEach(s => { if (!s.visible) return; const d = s.userData; d.life += dt; const k = d.life/d.max; if (k >= 1){ s.visible = false; return; } s.position.addScaledVector(d.v, dt); if (d.kind === 'wisp'){ s.position.x += Math.sin(t*.9 + d.max*3)*.0018; d.v.y *= .995; } s.scale.setScalar(d.s0 + (d.s1 - d.s0)*ease(k)); s.material.opacity = d.a*Math.sin(k*Math.PI); s.material.rotation += dt*.25; });
  sparks.forEach(s => { if (!s.visible) return; const d = s.userData; d.life += dt; const k = d.life/d.max; if (k >= 1){ s.visible = false; return; } d.v.y -= dt*.35; s.position.addScaledVector(d.v, dt); s.material.opacity = (1 - k)*(.6 + Math.random()*.4); });
  Object.values(parts).forEach(p => { const e = t - p.popT; if (e < .9){ const s = 1 + .06*Math.sin(e*13)*Math.exp(-e*5.5); p.pivot.scale.set(s, s, s); } else if (p !== parts.liquid) p.pivot.scale.set(1, 1, 1); });
  parts.liquid.pivot.scale.set(1, Math.max(.02, ease(Math.min(1, (t - S.liquidT)/1.1))), 1);
  parts.adds.inner.children.forEach(m => {
    const u = m.userData, h = u.home, e = (t - u.dropT)/.95;
    if (e >= 0 && e < 1){ const b = bounce(e); m.position.set(h.x*(.1 + b*.9), 1.08 + (h.y - 1.08)*b, h.z*(.1 + b*.9)); }
    else if (e < 0){ m.visible = false; return; }
    else { m.position.copy(h); if (u.float && !reduce.matches){ m.position.y += Math.sin(t*1.5 + u.ph)*.008; m.rotation.y += dt*.12; } }
    m.visible = true;
  });
  S.glint = Math.max(0, 1 - (t - S.glintT)/.7); S.glint *= S.glint;
  flaskShine.envMapIntensity = 2.2 + S.glint*1.2;
  glow.position.set(0, S.coalY + .03, 0); glow.scale.setScalar(.5 + inhale*.18); glow.material.opacity = .32 + inhale*.3 + Math.sin(t*5.3)*.03;
  // камера плавно подлетает к детали, не мешая крутить пальцем
  if (Math.abs(S.offY - S.goalOffY) > .5){ S.offY += (S.goalOffY - S.offY)*.12; camera.setViewOffset(frame.W, frame.H, 0, S.offY, frame.W, frame.H); camera.updateProjectionMatrix(); }
  if (t < S.focusUntil){
    controls.target.lerp(S.goalT, .07);
    sph.setFromVector3(camera.position.clone().sub(controls.target));
    sph.radius += (S.goalD - sph.radius)*.07; sph.phi += (S.goalPhi - sph.phi)*.07;
    camera.position.copy(controls.target).add(tmpP.setFromSpherical(sph));
  }
  controls.update();
  placeHots();
  renderer.render(scene, camera);
}

function sync(){

const REBUILD = {
  model: () => { buildAll(); ['flask','shaft','bowl','hose'].forEach(pop); },
  shape: () => { buildFlask(); buildLiquid(); buildShaft(); buildAdds(cfg.adds); buildBowl(); buildHose(); pop('flask'); },
  glass: () => { buildFlask(); pop('flask'); },
  liquid: () => buildLiquid(),
  adds: fresh => buildAdds(fresh),
  bowl: () => { buildBowl(); pop('bowl'); },
  heat: () => { buildBowl(); pop('bowl'); },
  finish: () => { buildShaft(); buildHose(); pop('shaft'); },
  hose: () => { buildHose(); pop('hose'); },
  flavor: () => updateSmokeColor(),
};
function changed(key, arg){
  cfg.preset = null;
  if (key === 'model'){ const m = byId(MODELS, cfg.model); Object.assign(cfg, { shape:m.shape, finish:m.finish, hose:m.hose }); if (m.id === 'classic' && cfg.bowl === 'phunnel') cfg.bowl = 'clay'; if (m.id === 'modern' && cfg.bowl === 'clay') cfg.bowl = 'phunnel'; }
  if (S.ready && REBUILD[key]) REBUILD[key](arg);
  sync();
}
function applyPreset(id){
  cfg = clone(byId(PRESETS, id).cfg); cfg.preset = id;
  if (S.ready){ buildAll(cfg.adds); updateSmokeColor(); ['flask','shaft','bowl','hose'].forEach(pop); }
  if (ui.open) setGroup(ui.group, true); else sync();
}
function toggleFlavor(id){ const f = cfg.flavors, i = f.findIndex(x => x[0] === id); if (i >= 0){ if (f.length === 1) return; f.splice(i, 1); } else { if (f.length >= 4) f.shift(); f.push([id, 0]); } const sp = SPLITS[f.length]; f.forEach((x, j) => x[1] = sp[j]); }
function bump(id, dir){
  const f = cfg.flavors, me = f.find(x => x[0] === id), others = f.filter(x => x !== me); if (!others.length) return;
  if (dir > 0){ const donor = others.filter(x => x[1] > 10).sort((a, b) => b[1] - a[1])[0]; if (!donor) return; donor[1] -= 5; me[1] += 5; }
  else { if (me[1] <= 10) return; others.sort((a, b) => a[1] - b[1])[0][1] += 5; me[1] -= 5; }
}
opts.addEventListener('click', e => {
  const cat = e.target.closest('[data-cat]');
  if (cat){ ui.cat = cat.dataset.cat; opts.querySelectorAll('[data-cat]').forEach(b => b.setAttribute('aria-pressed', b.dataset.cat === ui.cat)); $('chips').innerHTML = chipsHTML(); sync(); return; }
  const b = e.target.closest('[data-k]'); if (!b || b.disabled) return;
  const k = b.dataset.k, v = b.dataset.v;
  if (k === 'preset') return applyPreset(v);
  if (k === 'adds'){ const has = cfg.adds.includes(v); cfg.adds = has ? cfg.adds.filter(a => a !== v) : [...cfg.adds, v]; return changed('adds', has ? [] : [v]); }
  if (k === 'flavor'){ toggleFlavor(v); return changed('flavor'); }
  if (k === 'inc' || k === 'dec'){ bump(v, k === 'inc' ? 1 : -1); return changed('flavor'); }
  if (k === 'strength'){ cfg.strength = +v; return changed('strength'); }
  if (cfg[k] === v) return;
  cfg[k] = v; changed(k);
});

let toastT;

const device = $('device'), stage = $('stage');
const SIZES = { phone:[390, 844], kiosk:[1032, 1376] };
function layout(){
  const [W, H] = SIZES[ui.device];
  const fill = ui.device === 'phone' && innerWidth < 560;
  device.classList.toggle('fill', fill);
  if (fill) scaleFactor = 1;
  else {
    const st = stage.getBoundingClientRect(), pad = ui.device === 'kiosk' ? 46 : 32;
    scaleFactor = Math.min((st.width - pad*2)/W, (st.height - pad*2)/H, 1);
    device.style.width = W + 'px'; device.style.height = H + 'px';
    device.style.transform = `translate(-50%, -50%) scale(${scaleFactor})`;
  }
  resize();
}
function setDevice(d){
  ui.device = d; device.dataset.device = d;
  document.querySelectorAll('[data-dev]').forEach(b => b.setAttribute('aria-pressed', b.dataset.dev === d));
  layout(); requestAnimationFrame(() => { resize(); focus(true); });
}
document.querySelectorAll('[data-dev]').forEach(b => b.addEventListener('click', () => setDevice(b.dataset.dev)));
addEventListener('resize', layout);

setDevice(location.hash === '#kiosk' || location.search.includes('kiosk') ? 'kiosk' : 'phone');
